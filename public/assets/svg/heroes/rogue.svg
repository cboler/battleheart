<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dagger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="108" rx="32" ry="8" fill="rgba(0,0,0,0.45)"/>
  <!-- Scarf tail -->
  <path d="M42 54 Q18 60 14 78 Q28 76 42 64 Z" fill="#dc2626" stroke="#0f172a" stroke-width="3"/>
  <!-- Legs -->
  <rect x="45" y="84" width="11" height="20" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <rect x="64" y="84" width="11" height="20" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <!-- Agile Torso -->
  <rect x="40" y="54" width="40" height="34" rx="9" fill="url(#cloak)" stroke="#0f172a" stroke-width="3.5"/>
  <path d="M42 60 L78 80 M78 60 L42 80" stroke="#78350f" stroke-width="4"/>
  <!-- Head & Mask -->
  <circle cx="60" cy="39" r="21" fill="#fcd34d" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Shadow Hood -->
  <path d="M36 42 C34 12 86 12 84 42 L80 28 L60 22 L40 28 Z" fill="#1e293b" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Crimson Face Mask -->
  <path d="M39 42 Q60 37 81 42 L78 58 Q60 64 42 58 Z" fill="#b91c1c" stroke="#0f172a" stroke-width="3"/>
  <!-- Fierce Eyes -->
  <polygon points="47,36 57,39 48,41" fill="#fef08a"/>
  <polygon points="73,36 63,39 72,41" fill="#fef08a"/>
  <!-- Left Poison Dagger -->
  <g transform="translate(24, 68) rotate(-35)">
    <polygon points="0,-28 -6,0 6,0" fill="url(#dagger)" stroke="#0f172a" stroke-width="2.8"/>
    <rect x="-9" y="0" width="18" height="5" rx="2" fill="#ca8a04" stroke="#0f172a" stroke-width="2"/>
    <rect x="-3" y="5" width="6" height="9" rx="2" fill="#451a03" stroke="#0f172a" stroke-width="2"/>
  </g>
  <!-- Right Poison Dagger -->
  <g transform="translate(94, 66) rotate(40)">
    <polygon points="0,-28 -6,0 6,0" fill="url(#dagger)" stroke="#0f172a" stroke-width="2.8"/>
    <rect x="-9" y="0" width="18" height="5" rx="2" fill="#ca8a04" stroke="#0f172a" stroke-width="2"/>
    <rect x="-3" y="5" width="6" height="9" rx="2" fill="#451a03" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>

