  <path d="M36 42 C34 12 86 12 84 42 C78 24 60 22 60 22 C60 22 42 24 36 42 Z" fill="url(#rangercloak)" stroke="#0f172a" stroke-width="3.5"/>
  <circle cx="53" cy="40" r="3" fill="#0f172a"/>
  <circle cx="67" cy="40" r="3" fill="#0f172a"/>
  <!-- Recurve Longbow -->
  <g transform="translate(88, 64)">
    <path d="M-6 -36 Q18 0 -6 36" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
    <line x1="-6" y1="-34" x2="-6" y2="34" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#fde047" stroke-width="3"/>
    <polygon points="18,0 10,-5 10,5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
  </g>
