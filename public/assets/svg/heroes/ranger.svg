    <path d="M-4 -8 L-4 0 M2 -10 L2 0" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Legs -->
  <rect x="45" y="84" width="11" height="20" rx="5" fill="#451a03" stroke="#0f172a" stroke-width="3"/>
  <rect x="64" y="84" width="11" height="20" rx="5" fill="#451a03" stroke="#0f172a" stroke-width="3"/>
  <!-- Woodland Tunic -->
  <rect x="40" y="54" width="40" height="34" rx="9" fill="url(#rangercloak)" stroke="#0f172a" stroke-width="3.5"/>
  <path d="M38 56 Q60 68 82 56 L78 48 L42 48 Z" fill="#166534" stroke="#0f172a" stroke-width="3"/>
  <!-- Head & Hood -->
