<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="palarmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="108" rx="35" ry="8" fill="rgba(0,0,0,0.45)"/>
  <!-- Royal Blue Cape -->
  <path d="M32 54 Q20 84 26 102 L94 102 Q100 84 88 54 Z" fill="#1d4ed8" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Legs -->
  <rect x="44" y="86" width="12" height="18" rx="5" fill="#ca8a04" stroke="#0f172a" stroke-width="3"/>
  <rect x="64" y="86" width="12" height="18" rx="5" fill="#ca8a04" stroke="#0f172a" stroke-width="3"/>
  <!-- Gold Plate Torso -->
  <rect x="36" y="54" width="48" height="36" rx="10" fill="url(#palarmor)" stroke="#0f172a" stroke-width="3.5"/>
  <!-- White Tabard with Sun Emblem -->
  <rect x="47" y="54" width="26" height="36" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="60" cy="70" r="6" fill="#f59e0b"/>
  <!-- Chibi Head -->
  <circle cx="60" cy="38" r="20" fill="#fde68a" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Winged Circlet & Hair -->
  <path d="M40 30 Q60 16 80 30" fill="#f59e0b" stroke="#0f172a" stroke-width="3"/>
  <path d="M36 32 L26 20 L42 26 M84 32 L94 20 L78 26" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="53" cy="40" r="3" fill="#0f172a"/>
  <circle cx="67" cy="40" r="3" fill="#0f172a"/>
  <!-- Giant Two-Handed Warhammer -->
  <g transform="translate(88, 52) rotate(15)">
    <rect x="-3" y="-26" width="6" height="72" rx="3" fill="#78350f" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="-18" y="-38" width="36" height="18" rx="4" fill="url(#palarmor)" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="0" cy="-29" r="4" fill="#38bdf8"/>
  </g>
  <!-- Aegis Buckler -->
  <circle cx="30" cy="72" r="15" fill="url(#palarmor)" stroke="#f8fafc" stroke-width="3.5"/>
  <circle cx="30" cy="72" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
</svg>

