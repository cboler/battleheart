<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="108" rx="32" ry="8" fill="rgba(0,0,0,0.45)"/>
  <!-- Flowing Hood/Cape Back -->
  <path d="M34 48 Q24 80 30 102 L90 102 Q96 80 86 48 Z" fill="url(#robe)" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Gold Stole Trim -->
  <path d="M48 56 L45 100 M72 56 L75 100" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
  <path d="M32 96 L88 96" stroke="#3b82f6" stroke-width="4"/>
  <!-- Head & Hair -->
  <circle cx="60" cy="40" r="21" fill="#fde68a" stroke="#0f172a" stroke-width="3.5"/>
  <!-- White Hood -->
  <path d="M36 42 C34 15 86 15 84 42 C82 26 68 22 60 22 C52 22 38 26 36 42 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Blonde Bangs -->
  <path d="M42 32 Q52 24 62 32 Q72 24 78 34" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <!-- Gentle Eyes -->
  <ellipse cx="53" cy="42" rx="2.8" ry="3.8" fill="#0f172a"/>
  <ellipse cx="67" cy="42" rx="2.8" ry="3.8" fill="#0f172a"/>
  <circle cx="54" cy="40.5" r="1.2" fill="#ffffff"/>
  <circle cx="68" cy="40.5" r="1.2" fill="#ffffff"/>
  <circle cx="47" cy="46" r="3.5" fill="#fda4af" opacity="0.7"/>
  <circle cx="73" cy="46" r="3.5" fill="#fda4af" opacity="0.7"/>
  <!-- Healing Staff -->
  <g transform="translate(88, 56)">
    <rect x="-3" y="-32" width="6" height="78" rx="3" fill="#b45309" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="0" cy="-36" r="13" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="0" cy="-36" r="6" fill="#34d399" stroke="#0f172a" stroke-width="2"/>
    <path d="M0 -45 L0 -27 M-9 -36 L9 -36" stroke="#fef08a" stroke-width="2"/>
  </g>
  <!-- Praying / Casting Left Hand Glow -->
  <circle cx="36" cy="68" r="9" fill="rgba(52, 211, 153, 0.35)"/>
  <circle cx="36" cy="68" r="5" fill="#fde68a" stroke="#0f172a" stroke-width="2.5"/>
