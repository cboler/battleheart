<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="40%" stop-color="#3f6212"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
    <radialGradient id="dirtClearing" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="68%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Sky & Warm Sun Glow -->
  <rect width="800" height="220" fill="url(#sky)"/>
  <circle cx="660" cy="65" r="42" fill="#fef08a" opacity="0.65"/>
  <circle cx="660" cy="65" r="26" fill="#fffbeb" opacity="0.9"/>

  <!-- Drifting Clouds -->
  <g fill="#ffffff" opacity="0.78">
    <ellipse cx="150" cy="58" rx="46" ry="16"/>
    <ellipse cx="180" cy="52" rx="34" ry="18"/>
    <ellipse cx="122" cy="62" rx="28" ry="12"/>
    <ellipse cx="470" cy="44" rx="52" ry="15"/>
    <ellipse cx="502" cy="38" rx="36" ry="17"/>
  </g>

  <!-- Distant Snow-Capped Peaks -->
  <polygon points="40,195 160,72 285,195" fill="url(#mountainFar)"/>
  <polygon points="160,72 130,112 150,106 165,118 180,104 192,112" fill="#f8fafc"/>
  <polygon points="230,195 390,42 545,195" fill="url(#mountainNear)"/>
  <polygon points="390,42 350,94 374,85 392,102 412,84 430,94" fill="#f8fafc"/>
  <polygon points="480,195 620,66 770,195" fill="url(#mountainFar)"/>
  <polygon points="620,66 590,106 610,98 625,110 645,102" fill="#f8fafc"/>

  <!-- Rolling Midground Foothills -->
  <path d="M0 185 Q210 132 430 175 T800 165 L800 230 L0 230 Z" fill="#65a30d"/>
  <path d="M0 198 Q280 158 540 192 T800 186 L800 240 L0 240 Z" fill="#4d7c0f"/>

  <!-- Main Meadow Turf -->
  <rect y="192" width="800" height="308" fill="url(#grass)"/>

  <!-- Wooden Roadside Fence Along Horizon -->
  <g stroke="#271206" stroke-width="2" fill="#78350f">
    <rect x="145" y="192" width="510" height="5" rx="2"/>
    <rect x="145" y="202" width="510" height="5" rx="2"/>
    <rect x="160" y="182" width="8" height="30" rx="2"/>
    <rect x="230" y="182" width="8" height="30" rx="2"/>
    <rect x="300" y="182" width="8" height="30" rx="2"/>
    <rect x="370" y="182" width="8" height="30" rx="2"/>
    <rect x="440" y="182" width="8" height="30" rx="2"/>
    <rect x="510" y="182" width="8" height="30" rx="2"/>
    <rect x="580" y="182" width="8" height="30" rx="2"/>
    <rect x="640" y="182" width="8" height="30" rx="2"/>
  </g>

  <!-- Sunlit Dirt Battle Clearing -->
  <ellipse cx="400" cy="348" rx="355" ry="122" fill="#365314" opacity="0.7"/>
  <ellipse cx="400" cy="348" rx="338" ry="112" fill="url(#dirtClearing)" stroke="#451a03" stroke-width="3"/>
  <ellipse cx="400" cy="345" rx="295" ry="92" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.45"/>

  <!-- Cobblestone Accents & Wildflowers -->
  <g fill="#78716c" opacity="0.55">
    <ellipse cx="220" cy="310" rx="14" ry="7"/>
    <ellipse cx="242" cy="316" rx="9" ry="5"/>
    <ellipse cx="560" cy="385" rx="16" ry="8"/>
    <ellipse cx="538" cy="392" rx="10" ry="5"/>
    <ellipse cx="380" cy="272" rx="12" ry="6"/>
  </g>

  <!-- Lush Tree Clusters Framing Left & Right -->
  <g stroke="#0f172a" stroke-width="3">
    <!-- Left Oak Cluster -->
    <rect x="42" y="165" width="16" height="42" fill="#5c2810"/>
    <circle cx="50" cy="148" r="38" fill="#15803d"/>
    <circle cx="32" cy="158" r="28" fill="#166534"/>
    <circle cx="68" cy="160" r="26" fill="#22c55e" opacity="0.85"/>
    <rect x="102" y="176" width="12" height="32" fill="#5c2810"/>
    <circle cx="108" cy="162" r="28" fill="#166534"/>

    <!-- Right Oak Cluster -->
    <rect x="734" y="162" width="16" height="44" fill="#5c2810"/>
    <circle cx="742" cy="144" r="40" fill="#15803d"/>
    <circle cx="718" cy="158" r="28" fill="#22c55e" opacity="0.85"/>
    <circle cx="764" cy="158" r="28" fill="#166534"/>
    <rect x="678" y="176" width="12" height="32" fill="#5c2810"/>
    <circle cx="684" cy="164" r="26" fill="#15803d"/>
  </g>

  <!-- Foreground Boulders & Flowers -->
  <g stroke="#1c1917" stroke-width="2.5">
    <ellipse cx="48" cy="462" rx="34" ry="18" fill="#57534e"/>
    <ellipse cx="78" cy="470" rx="20" ry="12" fill="#78716c"/>
    <ellipse cx="748" cy="458" rx="36" ry="19" fill="#57534e"/>
    <ellipse cx="716" cy="468" rx="22" ry="13" fill="#78716c"/>
  </g>
  <g fill="#fde047">
    <circle cx="115" cy="245" r="3.5"/>
    <circle cx="128" cy="252" r="3"/>
    <circle cx="685" cy="248" r="3.5"/>
    <circle cx="668" cy="238" r="3"/>
  </g>
</svg>
