<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="40%" stop-color="#3f6212"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="320" fill="url(#sky)"/>
  <!-- Distant Mountains -->
  <polygon points="0,300 180,140 360,300" fill="#64748b" opacity="0.6"/>
  <polygon points="260,300 480,110 700,300" fill="#475569" opacity="0.7"/>
  <polygon points="620,300 860,130 1120,300" fill="#64748b" opacity="0.6"/>
  <!-- Rolling Hills -->
  <path d="M0 280 Q300 200 600 270 T1200 250 L1200 340 L0 340 Z" fill="#65a30d"/>
  <!-- Tree Line -->
  <g fill="#15803d" stroke="#052e16" stroke-width="4">
    <circle cx="90" cy="245" r="45"/>
    <circle cx="150" cy="255" r="38"/>
    <circle cx="1040" cy="240" r="48"/>
    <circle cx="1110" cy="255" r="40"/>
  </g>
  <!-- Arena Ground -->
  <rect y="275" width="1200" height="425" fill="url(#grass)"/>
  <!-- Dirt Battle Arena Oval -->
  <ellipse cx="600" cy="485" rx="520" ry="175" fill="url(#path)" opacity="0.38"/>
  <ellipse cx="600" cy="485" rx="480" ry="150" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="12 10" opacity="0.25"/>
</svg>

