<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="none">
  <defs>
    <linearGradient id="lavaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#180404"/>
      <stop offset="55%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="obsidianArena" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="72%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
  </defs>

  <!-- Volcanic Throne Room Horizon -->
  <rect width="800" height="205" fill="url(#lavaSky)"/>
  <polygon points="0,205 120,65 235,205" fill="#1c1917"/>
  <polygon points="270,205 400,32 530,205" fill="#0c0a09"/>
  <polygon points="560,205 690,58 800,205" fill="#1c1917"/>

  <!-- Molten Magma Sea & Obsidian Platform -->
  <rect y="200" width="800" height="300" fill="#7f1d1d"/>
  <ellipse cx="400" cy="348" rx="355" ry="120" fill="#ef4444" opacity="0.45"/>
  <ellipse cx="400" cy="348" rx="340" ry="112" fill="url(#obsidianArena)" stroke="#f97316" stroke-width="4"/>
  <ellipse cx="400" cy="348" rx="288" ry="90" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10 8" opacity="0.5"/>
</svg>
