<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cryptWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="cryptFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Gothic Stone Wall & Arches -->
  <rect width="800" height="205" fill="url(#cryptWall)"/>
  <g fill="#0f172a" stroke="#334155" stroke-width="3">
    <path d="M60 205 L60 95 Q115 35 170 95 L170 205 Z"/>
    <path d="M340 205 L340 85 Q400 25 460 85 L460 205 Z"/>
    <path d="M630 205 L630 95 Q685 35 740 205 Z"/>
  </g>

  <!-- Stone Pillars & Flickering Soul Torches -->
  <g fill="#334155" stroke="#0f172a" stroke-width="3">
    <rect x="220" y="30" width="38" height="175"/>
    <rect x="542" y="30" width="38" height="175"/>
  </g>
  <circle cx="239" cy="105" r="18" fill="#a855f7" opacity="0.35"/>
  <circle cx="239" cy="105" r="8" fill="#e879f9"/>
  <circle cx="561" cy="105" r="18" fill="#a855f7" opacity="0.35"/>
  <circle cx="561" cy="105" r="8" fill="#e879f9"/>

  <!-- Flagstone Crypt Floor & Ritual Circle -->
  <rect y="200" width="800" height="300" fill="#0f172a"/>
  <ellipse cx="400" cy="348" rx="342" ry="114" fill="url(#cryptFloor)" stroke="#475569" stroke-width="4"/>
  <ellipse cx="400" cy="348" rx="285" ry="90" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="12 8" opacity="0.45"/>
</svg>
