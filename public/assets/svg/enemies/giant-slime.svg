<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="slimeBody" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#65a30d" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#365314" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="slimeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfccb" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Shadow & Acid Puddle Base -->
  <ellipse cx="60" cy="106" rx="44" ry="10" fill="rgba(20, 83, 45, 0.55)"/>
  <ellipse cx="32" cy="108" rx="9" ry="4" fill="#84cc16" stroke="#1a2e05" stroke-width="2"/>
  <ellipse cx="90" cy="107" rx="11" ry="4.5" fill="#84cc16" stroke="#1a2e05" stroke-width="2"/>

  <!-- Translucent Gelatinous Dome -->
  <path
    d="M 18 96 C 12 68 26 24 60 24 C 94 24 108 68 102 96 C 98 108 22 108 18 96 Z"
    fill="url(#slimeBody)"
    stroke="#1a2e05"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <ellipse cx="56" cy="64" rx="28" ry="22" fill="url(#slimeCore)"/>

  <!-- Floating Digested Adventurer Skull & Bone Inside the Slime -->
  <g transform="translate(72, 48) rotate(18)" opacity="0.68" stroke="#1a2e05" stroke-width="2">
    <circle cx="0" cy="0" r="9" fill="#f1f5f9"/>
    <rect x="-5" y="6" width="10" height="6" rx="2" fill="#f1f5f9"/>
    <circle cx="-3" cy="-1" r="2" fill="#1a2e05"/>
    <circle cx="3" cy="-1" r="2" fill="#1a2e05"/>
  </g>

  <!-- Acid Bubbles -->
  <circle cx="38" cy="44" r="5" fill="#ecfccb" opacity="0.65"/>
  <circle cx="84" cy="76" r="4" fill="#ecfccb" opacity="0.55"/>
  <circle cx="44" cy="86" r="3.5" fill="#ecfccb" opacity="0.55"/>
  <circle cx="60" cy="20" r="4.5" fill="#a3e635" stroke="#1a2e05" stroke-width="2"/>

  <!-- Menacing Glowing Yellow-Red Slime Eyes & Wavy Mouth -->
  <circle cx="46" cy="64" r="6.5" fill="#fef08a" stroke="#1a2e05" stroke-width="2.5"/>
  <circle cx="46" cy="64" r="3" fill="#dc2626"/>
  <circle cx="72" cy="64" r="6.5" fill="#fef08a" stroke="#1a2e05" stroke-width="2.5"/>
  <circle cx="72" cy="64" r="3" fill="#dc2626"/>
  <path
    d="M 44 80 Q 52 74 60 80 T 76 80"
    fill="none"
    stroke="#1a2e05"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>

